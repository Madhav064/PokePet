<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PokePet</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      #pet {
        position: absolute;
        left: 0;
        top: 0;
        cursor: grab;
        will-change: transform;
        touch-action: none;
      }
      body.carrying,
      body.carrying #pet {
        cursor: grabbing;
      }
      body.awaiting,
      body.awaiting #pet {
        cursor: crosshair;
      }
      /* Speech bubbles above the pet: #hint while it waits for you to pick a spot,
         #say for announcements like evolving. */
      .bubble {
        position: absolute;
        left: 0;
        top: 0;
        display: none;
        pointer-events: none;
        will-change: transform;
      }
      body.awaiting #hint,
      body.saying:not(.awaiting) #say {
        display: block;
      }
      .bubble span {
        position: absolute;
        bottom: 6px;
        left: 0;
        transform: translateX(-50%);
        white-space: nowrap;
        padding: 6px 10px;
        border-radius: 10px;
        background: #fff;
        color: #1f2430;
        font: 600 12px/1.2 system-ui, "Segoe UI", sans-serif;
        box-shadow: 0 2px 10px rgb(0 0 0 / 0.25);
      }
      .bubble span::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -5px;
        margin-left: -5px;
        border: 5px solid transparent;
        border-bottom: 0;
        border-top-color: #fff;
      }
      .bubble small {
        display: block;
        font-weight: 400;
        opacity: 0.65;
      }
      /* Evolving: a few bright flashes, like a glow of light. */
      #sprite.evolving {
        animation: evolve 1.6s ease-in-out;
      }
      @keyframes evolve {
        0%, 100% { filter: brightness(1); }
        15%, 45%, 75% { filter: brightness(2.6) drop-shadow(0 0 10px #fff); }
        30%, 60% { filter: brightness(1.2); }
      }
    </style>
  </head>
  <body>
    <!-- #pet is moved around the screen; #sprite inside it is only animated and flipped. -->
    <div id="pet" role="img" aria-label="Your PokePet"><div id="sprite"></div></div>
    <div id="hint" class="bubble"><span>Click where I should go<small>Right-click or Esc to cancel</small></span></div>
    <div id="say" class="bubble" role="status"><span></span></div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
