<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PokePet</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      #pet {
        position: absolute;
        left: 0;
        top: 0;
        cursor: grab;
        will-change: transform;
        touch-action: none;
      }
      body.carrying,
      body.carrying #pet {
        cursor: grabbing;
      }
      body.awaiting,
      body.awaiting #pet {
        cursor: crosshair;
      }
      /* Speech bubble shown while the pet waits for you to pick a spot. */
      #hint {
        position: absolute;
        left: 0;
        top: 0;
        display: none;
        pointer-events: none;
        will-change: transform;
      }
      body.awaiting #hint {
        display: block;
      }
      #hint span {
        position: absolute;
        bottom: 6px;
        left: 0;
        transform: translateX(-50%);
        white-space: nowrap;
        padding: 6px 10px;
        border-radius: 10px;
        background: #fff;
        color: #1f2430;
        font: 600 12px/1.2 system-ui, "Segoe UI", sans-serif;
        box-shadow: 0 2px 10px rgb(0 0 0 / 0.25);
      }
      #hint span::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -5px;
        margin-left: -5px;
        border: 5px solid transparent;
        border-bottom: 0;
        border-top-color: #fff;
      }
      #hint small {
        display: block;
        font-weight: 400;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <!-- #pet is moved around the screen; #sprite inside it is only animated and flipped. -->
    <div id="pet" role="img" aria-label="Your PokePet"><div id="sprite"></div></div>
    <div id="hint"><span>Click where I should go<small>Right-click or Esc to cancel</small></span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
